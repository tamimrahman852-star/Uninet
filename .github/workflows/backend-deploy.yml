name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "api-gateway/**"
      - "services/**"
      - "infra/docker/**"
      - ".github/workflows/backend-deploy.yml"
  pull_request:
    paths:
      - "api-gateway/**"
      - "services/**"
      - "infra/docker/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'uninet-production' }}

jobs:
  test-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [api-gateway, services/auth-service, services/ecommerce-service]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npx tsc -p tsconfig.json --noEmit

  test-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/chat-service/go.sum
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./... -race -count=1

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [services/media-service, services/ai-service]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src

  build-and-deploy:
    needs: [test-node, test-go, test-python]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: gateway, dockerfile: infra/docker/Dockerfile.gateway }
          - { service: auth, dockerfile: infra/docker/Dockerfile.auth }
          - { service: chat, dockerfile: infra/docker/Dockerfile.chat }
          - { service: ecommerce, dockerfile: infra/docker/Dockerfile.ecommerce }
          - { service: media, dockerfile: infra/docker/Dockerfile.media }
          - { service: ai, dockerfile: infra/docker/Dockerfile.ai }
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/uninet/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/uninet/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Register new task definition revision
        id: taskdef
        run: |
          set -euo pipefail
          FAMILY="${ECS_CLUSTER}-${{ matrix.service }}"
          IMAGE="${{ steps.ecr.outputs.registry }}/uninet/${{ matrix.service }}:${{ github.sha }}"
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition > td.json
          jq --arg IMAGE "$IMAGE" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' td.json > td-new.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://td-new.json --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS and wait for stability
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "${{ matrix.service }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "${{ matrix.service }}"
