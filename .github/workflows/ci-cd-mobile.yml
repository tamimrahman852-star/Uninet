name: CI/CD Mobile

on:
  push:
    branches: [main]
    paths: ["mobile-app/**", ".github/workflows/ci-cd-mobile.yml"]
    tags: ["mobile-v*"]
  pull_request:
    paths: ["mobile-app/**", ".github/workflows/ci-cd-mobile.yml"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile-app

env:
  API_URL: ${{ vars.API_URL || 'https://api.example.com' }}
  WS_URL: ${{ vars.WS_URL || 'wss://api.example.com' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze
      - run: flutter test --no-pub || echo "no tests yet"

  build-android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release app bundle
        run: >
          flutter build appbundle --release
          --dart-define=API_URL=$API_URL
          --dart-define=WS_URL=$WS_URL
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: mobile-app/build/app/outputs/bundle/release/*.aab

  build-ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (no code signing)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_URL=$API_URL
          --dart-define=WS_URL=$WS_URL
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-runner
          path: mobile-app/build/ios/iphoneos/Runner.app
